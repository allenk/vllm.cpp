name: release

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    # FORK GUARD: this pipeline publishes under a fork-specific name and
    # version. Refuse to run anywhere else, so a clone of this repository
    # cannot emit artifacts that look like either fork's official build.
    if: github.repository == 'allenk/vllm.cpp'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      publish: ${{ steps.plan.outputs.publish }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute an explicit dry-run or exact-tag plan
        id: plan
        run: |
          project_version=$(python3 -c 'import json; print(json.load(open("release/release-version.json"))["project_version"])')
          test "$(sed -n 's/^project(vllm_cpp VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)" = "$project_version"
          python3 scripts/release_pipeline.py plan \
            --event '${{ github.event_name }}' \
            --ref '${{ github.ref }}' \
            --sha '${{ github.sha }}' \
            --release-version release/release-version.json \
            --matrix release/release-matrix.json \
            --output release-plan.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload immutable plan
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ github.sha }}
          path: release-plan.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  cpu_x86:
    needs: plan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install feature-poor userspace emulator and the TLS build files
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user
          # libssl-dev is named here rather than inherited. The ubuntu-latest
          # image happens to preinstall it, so this lane got the HuggingFace
          # fetch by accident; issue #1517 is what that accident looks like
          # when the environment does NOT carry it. CMakeLists.txt:2440-2482
          # downgrades silently on a failed find_package(OpenSSL), so a runner
          # image change would ship archives with `--model org/repo` disabled
          # and every gate still green.
          sudo apt-get install --yes libssl-dev
          scripts/install-intel-sde.sh "$RUNNER_TEMP/intel-sde"
      - name: Build, execute, package, and validate adaptive x86 CPU bundle
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          release_version=$(python3 -c 'import json; print(json.load(open("release/release-version.json"))["version"])')
          project_version=$(python3 -c 'import json; print(json.load(open("release/release-version.json"))["project_version"])')
          test "$release_version" = "$VERSION"
          test "$(sed -n 's/^project(vllm_cpp VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)" = "$project_version"
          scripts/build-cpu-release.sh \
            linux-x86_64-glibc-cpu x86_64 stable build-release-cpu-x86 \
            "$(getconf GNU_LIBC_VERSION | awk '{print $2}')" \
            "$(command -v qemu-x86_64)" \
            "$RUNNER_TEMP/intel-sde/sde64"
      - name: Upload exact validated x86 CPU asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64-glibc-cpu-${{ github.sha }}
          path: |
            build-release-cpu-x86/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-glibc-cpu.tar.gz
            build-release-cpu-x86/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-glibc-cpu.tar.gz.sha256
            build-release-cpu-x86/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-glibc-cpu.tar.gz.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  cpu_arm64:
    needs: plan
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install feature-poor userspace emulator and the TLS build files
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user
          # Named, not inherited. See the x86 CPU lane above and issue #1517.
          sudo apt-get install --yes libssl-dev
      - name: Build, execute, package, and validate adaptive Arm CPU bundle
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          release_version=$(python3 -c 'import json; print(json.load(open("release/release-version.json"))["version"])')
          project_version=$(python3 -c 'import json; print(json.load(open("release/release-version.json"))["project_version"])')
          test "$release_version" = "$VERSION"
          test "$(sed -n 's/^project(vllm_cpp VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)" = "$project_version"
          scripts/build-cpu-release.sh \
            linux-aarch64-glibc-cpu aarch64 stable build-release-cpu-arm64 \
            "$(getconf GNU_LIBC_VERSION | awk '{print $2}')" \
            "$(command -v qemu-aarch64)" \
            "$(command -v qemu-aarch64)"
      - name: Upload exact validated Arm CPU asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-aarch64-glibc-cpu-${{ github.sha }}
          path: |
            build-release-cpu-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-aarch64-glibc-cpu.tar.gz
            build-release-cpu-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-aarch64-glibc-cpu.tar.gz.sha256
            build-release-cpu-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-aarch64-glibc-cpu.tar.gz.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  cpu_musl:
    needs: plan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate the literal-static musl experiment
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          release_version=$(python3 -c 'import json; print(json.load(open("release/release-version.json"))["version"])')
          project_version=$(python3 -c 'import json; print(json.load(open("release/release-version.json"))["project_version"])')
          test "$release_version" = "$VERSION"
          test "$(sed -n 's/^project(vllm_cpp VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)" = "$project_version"
          scripts/install-intel-sde.sh "$RUNNER_TEMP/intel-sde"
          docker run --rm \
            -e EVIDENCE_URL -e SOURCE_DATE_EPOCH -e SOURCE_SHA -e VERSION \
            -v "$RUNNER_TEMP/intel-sde:/intel-sde:ro" \
            -v "$GITHUB_WORKSPACE:/src" -w /src alpine:3.22 sh -euxc '
              apk add --no-cache bash binutils build-base cmake file gcompat ninja python3 qemu-x86_64
              scripts/build-cpu-release.sh \
                linux-x86_64-musl-cpu-static x86_64 experimental-preview \
                build-release-cpu-musl 1.2.5 /usr/bin/qemu-x86_64 /intel-sde/sde64
            '
          sudo chown -R "$(id -u):$(id -g)" build-release-cpu-musl
      - name: Upload exact validated musl CPU asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64-musl-cpu-static-${{ github.sha }}
          path: |
            build-release-cpu-musl/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-musl-cpu-static.tar.gz
            build-release-cpu-musl/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-musl-cpu-static.tar.gz.sha256
            build-release-cpu-musl/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-musl-cpu-static.tar.gz.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  cuda_x86:
    needs: plan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container: nvidia/cuda:13.3.0-devel-ubuntu24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Install build and archive inspection tools
        run: |
          apt-get update
          # libssl-dev, or this lane publishes an archive whose vllm-server
          # cannot speak https. The job runs INSIDE nvidia/cuda:...-devel, so
          # there is no runner image to inherit from and the omission is total.
          # That is issue #1517, which was found in docker/Dockerfile's
          # builder-cuda stage carrying the identical list.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates cmake file g++ git libssl-dev ninja-build python3
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - name: Build and validate the x86 ten-SM CUDA bundle
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          scripts/build-linux-accelerator-release.sh \
            linux-x86_64-glibc-cuda cuda build-release-cuda-x86
      - name: Upload exact validated x86 CUDA asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64-glibc-cuda-${{ github.sha }}
          path: |
            build-release-cuda-x86/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-glibc-cuda.tar.gz
            build-release-cuda-x86/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-glibc-cuda.tar.gz.sha256
            build-release-cuda-x86/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-glibc-cuda.tar.gz.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  cuda_arm64:
    needs: plan
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container: nvidia/cuda:13.3.0-devel-ubuntu24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Install build and archive inspection tools
        run: |
          apt-get update
          # libssl-dev, or this lane publishes an archive whose vllm-server
          # cannot speak https. The job runs INSIDE nvidia/cuda:...-devel, so
          # there is no runner image to inherit from and the omission is total.
          # That is issue #1517, which was found in docker/Dockerfile's
          # builder-cuda stage carrying the identical list.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates cmake file g++ git libssl-dev ninja-build python3
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - name: Build and validate the Arm ten-SM CUDA bundle
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          scripts/build-linux-accelerator-release.sh \
            linux-aarch64-glibc-cuda cuda build-release-cuda-arm64
      - name: Upload exact validated Arm CUDA asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-aarch64-glibc-cuda-${{ github.sha }}
          path: |
            build-release-cuda-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-aarch64-glibc-cuda.tar.gz
            build-release-cuda-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-aarch64-glibc-cuda.tar.gz.sha256
            build-release-cuda-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-aarch64-glibc-cuda.tar.gz.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  vulkan_x86:
    needs: plan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software runtime, archive inspectors, TLS build files
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers
          # Named, not inherited. See the x86 CPU lane above and issue #1517.
          sudo apt-get install --yes libssl-dev
      - name: Build, execute, package, and validate Vulkan preview
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          scripts/build-linux-accelerator-release.sh \
            linux-x86_64-glibc-vulkan vulkan build-release-vulkan-x86
      - name: Upload exact validated Vulkan asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64-glibc-vulkan-${{ github.sha }}
          path: |
            build-release-vulkan-x86/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-glibc-vulkan.tar.gz
            build-release-vulkan-x86/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-glibc-vulkan.tar.gz.sha256
            build-release-vulkan-x86/release/vllm.cpp-${{ needs.plan.outputs.version }}-linux-x86_64-glibc-vulkan.tar.gz.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  metal_arm64:
    needs: plan
    permissions:
      contents: read
    runs-on: macos-15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, execute, package, and validate native Metal bundle
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          scripts/build-macos-release.sh \
            macos-arm64-metal stable build-release-metal-arm64
      - name: Upload exact validated Metal asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64-metal-${{ github.sha }}
          path: |
            build-release-metal-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-macos-arm64-metal.tar.gz
            build-release-metal-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-macos-arm64-metal.tar.gz.sha256
            build-release-metal-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-macos-arm64-metal.tar.gz.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  mlx_arm64:
    needs: plan
    permissions:
      contents: read
    runs-on: macos-15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the exact redistributable MLX runtime
        run: python3 -m pip install --disable-pip-version-check 'mlx==0.32.0'
      - name: Build, execute, package, and validate MLX preview
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          mlx_root=$(python3 -c 'import importlib.metadata as m; d=m.distribution("mlx"); print(d.locate_file("mlx"))')
          mlx_license=$(python3 -c 'import importlib.metadata as m; d=m.distribution("mlx"); print(next(str(d.locate_file(f)) for f in d.files if f.name.lower() in {"license", "license.txt"}))')
          test -f "$mlx_root/lib/libmlx.dylib"
          test -f "$mlx_root/lib/mlx.metallib" -o -f "$mlx_root/mlx.metallib"
          test -f "$mlx_license"
          scripts/build-macos-release.sh \
            macos-arm64-metal-mlx preview build-release-mlx-arm64 \
            "$mlx_root" 0.32.0 "$mlx_license"
      - name: Upload exact validated MLX asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64-metal-mlx-${{ github.sha }}
          path: |
            build-release-mlx-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-macos-arm64-metal-mlx.tar.gz
            build-release-mlx-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-macos-arm64-metal-mlx.tar.gz.sha256
            build-release-mlx-arm64/release/vllm.cpp-${{ needs.plan.outputs.version }}-macos-arm64-metal-mlx.tar.gz.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  cpu_windows:
    needs: plan
    permissions:
      contents: read
    runs-on: windows-2022
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      # dumpbin is an MSVC tool and is only on PATH inside a Developer Command
      # Prompt. Invoke-CrtAudit calls it bare (build-windows-release.ps1:856 and
      # four more), which works on a developer box and not on a bare runner.
      - name: Enter the MSVC developer environment so dumpbin resolves
        uses: ilammy/msvc-dev-cmd@v1
      - name: Prove Windows PowerShell and CRT rejection contracts
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_DATE_EPOCH: '0'
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: ./scripts/build-windows-release.ps1 -ContractTest
      - name: Build, execute, package, and validate native Windows CPU preview
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $env:SOURCE_DATE_EPOCH = (git show -s --format=%ct HEAD).Trim()
          $release = Get-Content release/release-version.json -Raw | ConvertFrom-Json
          if ($release.version -ne $env:VERSION) { throw "release version drift" }
          ./scripts/build-windows-release.ps1 `
            -Backend cpu `
            -ArtifactId windows-x86_64-msvc-cpu `
            -BuildDir $env:GITHUB_WORKSPACE/build-release-windows-cpu
      - name: Upload exact validated Windows CPU asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64-msvc-cpu-${{ github.sha }}
          path: |
            build-release-windows-cpu/release/vllm.cpp-${{ needs.plan.outputs.version }}-windows-x86_64-msvc-cpu.zip
            build-release-windows-cpu/release/vllm.cpp-${{ needs.plan.outputs.version }}-windows-x86_64-msvc-cpu.zip.sha256
            build-release-windows-cpu/release/vllm.cpp-${{ needs.plan.outputs.version }}-windows-x86_64-msvc-cpu.zip.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  vulkan_windows:
    needs: plan
    permissions:
      contents: read
    runs-on: windows-2022
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      # dumpbin is an MSVC tool and is only on PATH inside a Developer Command
      # Prompt. Invoke-CrtAudit calls it bare (build-windows-release.ps1:856 and
      # four more), which works on a developer box and not on a bare runner.
      - name: Enter the MSVC developer environment so dumpbin resolves
        uses: ilammy/msvc-dev-cmd@v1
      - name: Prove Windows PowerShell and CRT rejection contracts
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_DATE_EPOCH: '0'
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: ./scripts/build-windows-release.ps1 -ContractTest
      - name: Build, execute, package, and validate native Windows Vulkan preview
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $env:SOURCE_DATE_EPOCH = (git show -s --format=%ct HEAD).Trim()
          $release = Get-Content release/release-version.json -Raw | ConvertFrom-Json
          if ($release.version -ne $env:VERSION) { throw "release version drift" }
          ./scripts/build-windows-release.ps1 `
            -Backend vulkan `
            -ArtifactId windows-x86_64-msvc-vulkan `
            -BuildDir $env:GITHUB_WORKSPACE/build-release-windows-vulkan
      - name: Upload exact validated Windows Vulkan asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64-msvc-vulkan-${{ github.sha }}
          path: |
            build-release-windows-vulkan/release/vllm.cpp-${{ needs.plan.outputs.version }}-windows-x86_64-msvc-vulkan.zip
            build-release-windows-vulkan/release/vllm.cpp-${{ needs.plan.outputs.version }}-windows-x86_64-msvc-vulkan.zip.sha256
            build-release-windows-vulkan/release/vllm.cpp-${{ needs.plan.outputs.version }}-windows-x86_64-msvc-vulkan.zip.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  # CUDA is a PREVIEW lane and says so: it is built for sm_120a ONLY.
  # A Triton AOT artifact is a cubin and therefore single-arch, so the
  # architecture the build declares has to match a vendored tree under
  # src/vt/cuda/triton_aot_vendored/, and only sm_120a was generated on
  # hardware here. Other architectures are not faked.
  #
  # The runner has no NVIDIA GPU, so this lane proves BUILD and PACKAGING.
  # It does not prove execution, and nothing here should be read as if it
  # did -- the Vulkan and CPU lanes above run their focused tests because
  # those backends work on a runner; a CUDA test needs a card.
  cuda_windows:
    needs: plan
    permissions:
      contents: read
    runs-on: windows-2022
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      # dumpbin is an MSVC tool and is only on PATH inside a Developer Command
      # Prompt. Invoke-CrtAudit calls it bare (build-windows-release.ps1:856 and
      # four more), which works on a developer box and not on a bare runner.
      - name: Enter the MSVC developer environment so dumpbin resolves
        uses: ilammy/msvc-dev-cmd@v1
      # Linux gets nvcc from `container: nvidia/cuda:...-devel`. GitHub refuses
      # container jobs on Windows, so this lane installs the toolkit instead.
      # nvcc plus the VS integration only: the full toolkit is several GB and the
      # runner has neither the disk nor the minutes to spare.
      - name: Install the CUDA toolkit this lane compiles against
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'
          sub-packages: '["nvcc", "visual_studio_integration", "cudart", "nvrtc"]'
          method: 'network'
      # The installer above sets CUDA_PATH but does NOT put nvcc on PATH, and
      # `check_language(CUDA)` looks on PATH (or at $CUDACXX) and nowhere else.
      # MEASURED, run 35855557148: the toolkit installed for four minutes, the
      # step env showed CUDA_PATH=...\CUDA\v13.3, and configure still said
      #   -- Looking for a CUDA compiler - NOTFOUND
      #   CMake Error at CMakeLists.txt:222 (message):
      #     VLLM_CPP_CUDA=ON but no CUDA compiler was found.
      # A present toolkit that the build cannot see fails identically to an
      # absent one, so this step makes the hand-off explicit and refuses if the
      # compiler really is missing -- the two cases must not look alike again.
      - name: Hand nvcc to CMake explicitly, and prove it is there
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH) { throw "CUDA_PATH is unset after the toolkit install" }
          $bin = Join-Path $env:CUDA_PATH 'bin'
          $nvcc = Join-Path $bin 'nvcc.exe'
          if (-not (Test-Path $nvcc)) { throw "no nvcc.exe at $nvcc" }
          & $nvcc --version
          "CUDACXX=$nvcc"  | Out-File -FilePath $env:GITHUB_ENV  -Append -Encoding utf8
          $bin             | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # ...and then install the MSBuild integration, which is what this lane
      # ACTUALLY resolves CUDA through.
      #
      # build-windows-release.ps1:43 configures with -G "Visual Studio 17 2022".
      # With the VS generator, `enable_language(CUDA)` looks for
      # `CUDA <ver>.props`/`.targets` under the VS installation's
      # BuildCustomizations directory. It does not consult CUDACXX and it does
      # not consult PATH. So the step above is necessary and was NOT sufficient,
      # and the second dry run says so precisely: run 35872523883 printed
      #   nvcc: ... Cuda compilation tools, release 13.3, V13.3.33
      #   CUDACXX: C:\...\CUDA\v13.3\bin\nvcc.exe
      #   -- The CXX compiler identification is MSVC 19.44.35228.0
      #   -- Looking for a CUDA compiler - NOTFOUND      (in 2.4 seconds)
      # A 2.4-second NOTFOUND with a working nvcc on PATH is not a search that
      # failed; it is a search that was never looking there.
      #
      # RULED OUT, so it is not re-guessed later: the host-compiler version
      # gate. CUDA's crt/host_config.h refuses `_MSC_VER < 1920 || >= 1960`
      # and MSVC 19.44 is 1944, inside the window.
      #
      # The toolkit ships the integration under
      # extras/visual_studio_integration/MSBuildExtensions; the network
      # installer only places it when it finds VS where it expects. Copying it
      # is NVIDIA's own documented remedy for VS-installed-after-CUDA, and here
      # the same asymmetry exists for a different reason.
      - name: Install the CUDA MSBuild integration the VS generator resolves through
        shell: pwsh
        run: |
          $src = Join-Path $env:CUDA_PATH 'extras\visual_studio_integration\MSBuildExtensions'
          if (-not (Test-Path $src)) { throw "no MSBuildExtensions under $env:CUDA_PATH" }
          Write-Host "integration source:"; Get-ChildItem $src | ForEach-Object { Write-Host "  $($_.Name)" }
          $roots = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -Directory -ErrorAction SilentlyContinue
          if (-not $roots) { throw "no Visual Studio 2022 installation found" }
          $installed = $false
          foreach ($r in $roots) {
            $dst = Join-Path $r.FullName 'MSBuild\Microsoft\VC\v170\BuildCustomizations'
            if (-not (Test-Path $dst)) { continue }
            Copy-Item "$src\*" $dst -Force
            $props = Get-ChildItem $dst -Filter 'CUDA *.props' -ErrorAction SilentlyContinue
            if ($props) {
              $installed = $true
              Write-Host "installed into $dst :"; $props | ForEach-Object { Write-Host "  $($_.Name)" }
            }
          }
          # Prove it, rather than assume the copy took. A silent no-op here
          # costs the whole lane five minutes later, with a message that points
          # at a missing toolkit instead of a missing props file.
          if (-not $installed) { throw "CUDA props did not land in any VS BuildCustomizations directory" }
      - name: Prove Windows PowerShell and CRT rejection contracts
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_DATE_EPOCH: '0'
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: ./scripts/build-windows-release.ps1 -ContractTest
      - name: Build, execute, package, and validate native Windows CUDA preview
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $env:SOURCE_DATE_EPOCH = (git show -s --format=%ct HEAD).Trim()
          $release = Get-Content release/release-version.json -Raw | ConvertFrom-Json
          if ($release.version -ne $env:VERSION) { throw "release version drift" }
          ./scripts/build-windows-release.ps1 `
            -Backend cuda `
            -ArtifactId windows-x86_64-msvc-cuda `
            -BuildDir $env:GITHUB_WORKSPACE/build-release-windows-cuda
      - name: Upload exact validated Windows CUDA asset triplet
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64-msvc-cuda-${{ github.sha }}
          path: |
            build-release-windows-cuda/release/vllm.cpp-${{ needs.plan.outputs.version }}-windows-x86_64-msvc-cuda.zip
            build-release-windows-cuda/release/vllm.cpp-${{ needs.plan.outputs.version }}-windows-x86_64-msvc-cuda.zip.sha256
            build-release-windows-cuda/release/vllm.cpp-${{ needs.plan.outputs.version }}-windows-x86_64-msvc-cuda.zip.provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  build:
    needs: [plan, cpu_x86, cpu_arm64, cpu_musl, cuda_x86, cuda_arm64, vulkan_x86, metal_arm64, mlx_arm64, cpu_windows, vulkan_windows, cuda_windows]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact immutable plan by ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: plan
          merge-multiple: true
      - name: Download exact validated CPU artifacts by immutable IDs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.cpu_x86.outputs.artifact_id }},${{ needs.cpu_arm64.outputs.artifact_id }},${{ needs.cpu_musl.outputs.artifact_id }},${{ needs.cuda_x86.outputs.artifact_id }},${{ needs.cuda_arm64.outputs.artifact_id }},${{ needs.vulkan_x86.outputs.artifact_id }},${{ needs.metal_arm64.outputs.artifact_id }},${{ needs.mlx_arm64.outputs.artifact_id }},${{ needs.cpu_windows.outputs.artifact_id }},${{ needs.vulkan_windows.outputs.artifact_id }},${{ needs.cuda_windows.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true
      - name: Produce the byte-bound release handoff
        run: |
          python3 scripts/release_pipeline.py handoff \
            --plan plan/release-plan.json \
            --assets-dir release-assets \
            --output release-handoff.json
      - name: Upload immutable unverified handoff
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-unverified-${{ github.sha }}
          path: |
            release-handoff.json
            release-assets
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  verify:
    needs: [plan, build]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact plan by ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: plan
          merge-multiple: true
      - name: Download exact unverified handoff by ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: unverified
          merge-multiple: true
      - name: Verify handoff against plan and workflow SHA
        run: |
          mkdir -p verified
          cp -a unverified/release-assets verified/release-assets
          python3 scripts/release_pipeline.py verify \
            --plan plan/release-plan.json \
            --handoff unverified/release-handoff.json \
            --assets-dir verified/release-assets \
            --output verified/verified-handoff.json \
            --sha '${{ github.sha }}'
      - name: Generate byte-derived release indexes
        run: |
          python3 scripts/release_index.py \
            --assets-dir verified/release-assets \
            --handoff verified/verified-handoff.json \
            --json-output verified/release-index.json \
            --markdown-output verified/RELEASE_INDEX.md \
            --retention-days 7
      - name: Upload immutable verified handoff
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-verified-${{ github.sha }}
          path: verified
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  attest:
    needs: [plan, verify]
    if: needs.plan.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - name: Download only the verified handoff by ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: verified
          merge-multiple: true
      - name: Attest verified bytes
        uses: actions/attest@v4
        with:
          subject-path: verified/release-assets/**
  publish:
    needs: [plan, verify, attest]
    if: needs.plan.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download only the verified handoff by ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: verified
          merge-multiple: true
      - name: Publish the exact verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ needs.plan.outputs.release_tag }}'
          test "$tag" = "${GITHUB_REF#refs/tags/}"
          python3 scripts/release_pipeline.py publish \
            --handoff verified/verified-handoff.json \
            --assets-dir verified/release-assets \
            --index-json verified/release-index.json \
            --index-markdown verified/RELEASE_INDEX.md \
            --tag "$tag"
