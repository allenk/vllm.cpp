name: release-postpublish-audit

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Audit only authenticated remote release state and bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_postpublish_audit.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag v0.0.3-vk.1 \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --release-version release/release-version.json \
            --matrix release/release-matrix.json
